plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "msat.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // S-Lib
    modImplementation "com.stalemated.lib:s-lib-forge:${rootProject.s_lib_version}"
    // Custom Tooltip API
    modRuntimeOnly "com.stalemated.cta:custom_tooltip_api-forge:${rootProject.cta_version}"

    // YACL
    modRuntimeOnly "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-forge"
    // quilt-parsers is a transitive runtime dependency of YACL Forge (used by GsonConfigSerializer)
    // Loom does not propagate JarJar (Jar-in-Jar) automatically so we declare it explicitly
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:0.3.0"
    forgeRuntimeLibrary "org.quiltmc.parsers:json:0.3.0"

    // ModMenu
    modImplementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // Mutant Monsters + Puzzles Lib (jar file) + Jar-In-Jar Dependencies
    modRuntimeOnly "curse.maven:mutant-monsters-852665:${rootProject.mutant_monsters_file_id_forge}"
    modRuntimeOnly files('libs/PuzzlesLib-v8.1.33-1.20.1-Forge.jar')
    modRuntimeOnly files('libs/puzzlesaccessapi-forge-20.1.1.jar')
    implementation files('libs/mixinextras-forge-0.4.1.jar')

    // Cardinal Components API
    modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cardinal_components_api_version}"
    modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${rootProject.cardinal_components_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
